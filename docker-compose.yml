services:
  postgres:
    image: postgres:16-alpine
    container_name: flower_cage_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "gjka#*dka"
      POSTGRES_DB: flower_cage_dev
    ports:
      - "5432:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flower_cage_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
